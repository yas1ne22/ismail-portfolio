<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--figma-color-text, #24252a);
      background: var(--figma-color-bg, #fff);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-size: 12px; }
    button, input { font: inherit; }
    .plugin { min-height: 100vh; display: flex; flex-direction: column; }
    header { display: flex; align-items: center; gap: 10px; padding: 15px 16px; border-bottom: 1px solid var(--figma-color-border, #e5e5e8); }
    .mark { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, #806df1, #5942d7); font-weight: 800; }
    header strong { font-size: 13px; }
    main { padding: 17px 16px 20px; display: grid; gap: 17px; }
    h1 { margin: 0 0 5px; font-size: 15px; line-height: 1.25; }
    p { margin: 0; color: var(--figma-color-text-secondary, #696a72); line-height: 1.45; }
    .field { display: grid; gap: 8px; }
    .field > label, .field-title { font-weight: 650; color: var(--figma-color-text, #24252a); }
    .segmented { display: grid; grid-template-columns: 1fr 1fr; padding: 2px; border-radius: 7px; background: var(--figma-color-bg-secondary, #f0f0f3); }
    .segmented button { min-height: 30px; border: 0; border-radius: 5px; color: var(--figma-color-text-secondary, #62636b); background: transparent; cursor: pointer; }
    .segmented button.active { color: var(--figma-color-text, #24252a); background: var(--figma-color-bg, #fff); box-shadow: 0 1px 3px rgba(20,20,25,.12); font-weight: 650; }
    .toggle-row, .number-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .switch { position: relative; width: 34px; height: 20px; flex: 0 0 auto; }
    .switch input { opacity: 0; position: absolute; }
    .switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--figma-color-bg-tertiary, #d7d7dc); cursor: pointer; transition: .18s; }
    .switch span:after { content: ""; position: absolute; width: 14px; height: 14px; top: 3px; left: 3px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.18); transition: .18s; }
    .switch input:checked + span { background: #6855e8; }
    .switch input:checked + span:after { transform: translateX(14px); }
    input[type="number"] { width: 74px; height: 30px; padding: 0 9px; border: 1px solid var(--figma-color-border, #dcdce1); border-radius: 6px; color: var(--figma-color-text, #24252a); background: var(--figma-color-bg, #fff); }
    .selection { padding: 11px 12px; border: 1px solid var(--figma-color-border, #e1e1e5); border-radius: 8px; background: var(--figma-color-bg-secondary, #f7f7f9); }
    .selection strong { display: block; margin-bottom: 3px; }
    .selection span { color: var(--figma-color-text-secondary, #777780); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
    .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 13px; color: var(--figma-color-text-secondary, #62636b); font-size: 11px; }
    .checks span:before { content: "✓"; margin-right: 5px; color: #6855e8; font-weight: 800; }
    footer { margin-top: auto; min-height: 62px; padding: 11px 12px 11px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid var(--figma-color-border, #e5e5e8); }
    #status { max-width: 155px; color: var(--figma-color-text-secondary, #74757d); font-size: 10px; line-height: 1.35; }
    #run { min-height: 34px; padding: 0 13px; border: 0; border-radius: 7px; color: #fff; background: #6855e8; font-weight: 700; cursor: pointer; }
    #run:hover { background: #5843ce; }
    #run:disabled { cursor: default; opacity: .45; }
    .error { color: var(--figma-color-text-danger, #c43838) !important; }
    .success { color: var(--figma-color-text-success, #23734d) !important; }
  </style>
</head>
<body>
  <div class="plugin" id="plugin-root">
    <header><span class="mark">→</span><strong>Design Handoff Built</strong></header>
    <main>
      <section><h1>Audit before you hand off</h1><p>Scan layers, surface delivery risks, and create a structured report beside the work.</p></section>
      <div class="field">
        <span class="field-title">Audit scope</span>
        <div class="segmented" role="group" aria-label="Audit scope">
          <button type="button" id="selection-scope" class="active" aria-pressed="true">Selection</button>
          <button type="button" id="page-scope" aria-pressed="false">Current page</button>
        </div>
      </div>
      <div class="toggle-row"><label for="hidden">Include hidden layers</label><label class="switch"><input id="hidden" type="checkbox"><span aria-hidden="true"></span></label></div>
      <div class="number-row"><label for="maximum">Maximum findings</label><input id="maximum" type="number" min="10" max="200" step="10" value="60"></div>
      <div class="selection"><strong id="selection-count">No selection</strong><span id="selection-label">Select a frame or choose Current page</span></div>
      <div class="checks" aria-label="Checks included"><span>Naming</span><span>Auto layout</span><span>Components</span><span>Typography</span><span>Touch targets</span><span>Hidden layers</span></div>
    </main>
    <footer><span id="status">Ready to audit</span><button id="run" type="button" disabled>Create handoff report</button></footer>
  </div>
  <script>
    const post = (message) => parent.postMessage({ pluginMessage: message }, "*");
    const selectionButton = document.getElementById("selection-scope");
    const pageButton = document.getElementById("page-scope");
    const hidden = document.getElementById("hidden");
    const maximum = document.getElementById("maximum");
    const run = document.getElementById("run");
    const status = document.getElementById("status");
    const count = document.getElementById("selection-count");
    const label = document.getElementById("selection-label");
    let scope = "selection";
    let selectionCount = 0;
    let busy = false;

    function setScope(next) {
      scope = next;
      const selectionActive = scope === "selection";
      selectionButton.classList.toggle("active", selectionActive);
      pageButton.classList.toggle("active", !selectionActive);
      selectionButton.setAttribute("aria-pressed", String(selectionActive));
      pageButton.setAttribute("aria-pressed", String(!selectionActive));
      updateButton();
    }

    function updateButton() {
      run.disabled = busy || (scope === "selection" && selectionCount === 0);
    }

    function setStatus(message, className) {
      status.textContent = message;
      status.className = className || "";
    }

    selectionButton.addEventListener("click", () => setScope("selection"));
    pageButton.addEventListener("click", () => setScope("page"));
    run.addEventListener("click", () => {
      busy = true;
      updateButton();
      setStatus("Scanning layers…");
      run.textContent = "Working…";
      post({
        type: "run-audit",
        scope,
        includeHidden: hidden.checked,
        maximum: Number(maximum.value)
      });
    });

    onmessage = (event) => {
      const message = event.data.pluginMessage;
      if (!message) return;
      if (message.type === "selection-status") {
        selectionCount = message.count;
        count.textContent = message.count ? `${message.count} selected` : "No selection";
        label.textContent = message.label;
        updateButton();
      }
      if (message.type === "busy") {
        busy = true;
        run.textContent = "Working…";
        setStatus(message.message);
        updateButton();
      }
      if (message.type === "result") {
        busy = false;
        run.textContent = "Create handoff report";
        setStatus(message.message, "success");
        updateButton();
      }
      if (message.type === "error") {
        busy = false;
        run.textContent = "Create handoff report";
        setStatus(message.message, "error");
        updateButton();
      }
    };

    post({ type: "ready" });
  </script>
</body>
</html>
